<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="the tsubasa captain: a skull tricorn and round spectacles">
<title>tsubasa</title>
<defs>
<path id="d" d="M200 12 C 268 10 334 50 362 114 C 388 176 382 252 344 306 C 306 362 244 392 190 388 C 128 384 66 350 36 292 C 8 236 10 158 44 104 C 78 50 138 16 200 12 Z"/>
