  <g fill="#EFE7D8">
    <circle cx="-46" cy="-18" r="8"/><circle cx="46" cy="-18" r="8"/>
    <circle cx="-46" cy="20" r="8"/><circle cx="46" cy="20" r="8"/>
    <path d="M0 -26 C 19 -26 33 -12 33 4 C 33 13 29 20 22 24
