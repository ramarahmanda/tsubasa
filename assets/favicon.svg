</defs>
<use href="#d" fill="#EFE7D8"/>
<g clip-path="url(#i)">

<!-- long hair, behind -->
<g fill="#17130F">
<path d="M104 206 C 84 248 80 314 94 364 C 99 386 107 398 116 400 L 126 356 C 110 312 108 260 120 220 Z"/>
<path d="M296 206 C 318 250 324 320 308 370 C 303 390 295 399 286 400 L 276 354 C 292 310 294 256 282 216 Z"/>
