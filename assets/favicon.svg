  <ellipse cx="242" cy="268" rx="16" ry="17"/>
</g>

<!-- tricorn: silhouette lifted from the traced artwork -->
<path fill="#17130F" d="M136.4 61.4 147.6 56.9 158.9 53.5 170.2 51.3 181.4 51.3 192.7 52.4 203.9 53.5 212.9 53.5 222.0 49.0 231.0 43.4 240.0 40.0 249.0 40.0 258.0 43.4 264.7 49.0 269.2 60.3 273.8 71.5 278.3 82.8 282.8 94.0 288.4 105.3 295.1 116.6 303.0 125.6 314.3 134.6 326.7 141.3 341.3 148.1 354.8 154.9 363.8 162.7 369.5 170.6 372.8 178.5 374.0 185.3 366.1 194.3 357.1 201.0 345.8 207.8 332.3 213.4 300.8 224.7 233.2 229.2 165.7 229.2 98.1 224.7 82.3 215.7 71.1 208.9 59.8 201.0 48.6 193.1 39.5 184.1 35.0 176.2 35.0 168.4 39.5 160.5 48.6 153.7 59.8 148.1 72.2 142.5 84.6 136.8 95.8 132.3 104.9 126.7 110.5 118.8 112.7 107.6 112.7 96.3 115.0 85.0 118.4 74.9 125.1 67.0 131.9 63.6Z"/>

