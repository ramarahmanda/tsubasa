<!-- skull and crossbones on the crown -->
<g transform="translate(207 152) scale(1.05)">
  <g stroke="#EFE7D8" stroke-width="13" stroke-linecap="round">
    <path d="M-46 -18 L 46 20"/>
    <path d="M46 -18 L -46 20"/>
